<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Biome Hunt</title>
<style>body{margin:0;height:100vh;display:flex;align-items:center;justify-content:center;background:#14161c;color:#eef0f4;font:18px system-ui,sans-serif;text-align:center;padding:16px}</style>
</head><body><div id="m">Finding the Biome Hunt server…</div>
<script>
// Stable link: looks up the game server's current address and goes there.
fetch('https://gist.githubusercontent.com/HalbyStarcraft/becb7300309f670dda6b6c65271a7f86/raw/server_url.json?t=' + Date.now())
  .then(r => r.json())
  .then(j => { if (!j.url) throw 0; location.replace(j.url.replace(/^wss/, 'https')); })
  .catch(() => { document.getElementById('m').textContent = 'The game server is offline right now. Try again later!'; });
</script></body></html>
